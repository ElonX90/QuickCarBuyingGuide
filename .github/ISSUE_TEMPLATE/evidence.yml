name: 补充证据或新车型
description: 提供可追溯资料，审核通过后才进入正式指数
title: '[证据] '
body:
  - type: markdown
    attributes:
      value: '感谢补证。提交不等于采纳；请给原始链接和具体位置，勿上传个人凭据或来源全文。'
  - type: dropdown
    id: category
    attributes:
      label: 数据类别
      options: [研发周期, 全球化, 正式召回, 五险一金, 外包或劳务派遣, SKU配置, 月销量及车系映射, 新车型, 其他证据]
    validations:
      required: true
  - type: input
    id: subject
    attributes:
      label: 车型、世代或年款、动力与国内海外版本
      placeholder: 例如 尚界H5 2026年款 增程Max+ 中国销售版
    validations:
      required: true
  - type: input
    id: entity
    attributes:
      label: 企业主体及范围
      description: 涉及用工时填企业法人、地区和岗位/员工范围；不适用请说明。
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: 事实发生日期、报告覆盖期与地区
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: 当前值、建议值或区间、单位及修改理由
    validations:
      required: true
  - type: input
    id: original_url
    attributes:
      label: 原始公开来源URL
      description: 给到具体文件/页面，优先监管或企业原始资料；打不开的链接请提供可核查公开替代链接。
    validations:
      required: true
  - type: textarea
    id: locator
    attributes:
      label: 页码、表格、段落或视频时间点与必要简短摘记
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: 证据能证明、不能证明的事项及冲突/整改资料
      description: 不能将上一代、其他动力、集团其他法人或旧报告期外推到当前全部范围。
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: 投稿确认
      options:
        - label: 我提供了可核查证据，并理解投稿先待审核，不能直接自动改分
          required: true
        - label: 我已去除个人身份、账号和其他敏感凭据，未复制来源全文
          required: true
