name: Collect public September sales evidence
on:
  push:
    branches: [research/september-2026-sales]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read public source facts
        run: python scripts/collect_sales_evidence.py
