name: Validate reviewed car index
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node calculator/tests/scoring.test.cjs
      - run: python calculator/scripts/build_assets.py --check
      - run: python scripts/build.py --check
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build.py
      - run: git diff --exit-code -- docs/RANKING.md docs/MODEL_DETAILS.md docs/SOURCES.md data/scores.json data/model-index.csv docs/SALES_TOP100.md data/sales-top100.csv docs/DATA_QUALITY.md
      - name: Save generated evidence and score preview
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-index-preview
          path: |
            docs/RANKING.md
            docs/SALES_TOP100.md
            docs/DATA_QUALITY.md
            data/scores.json
            data/model-index.csv
            data/sales-top100.csv
          retention-days: 14
  calculator-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependency
        working-directory: calculator/tests
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Install Chromium for UI checks
        working-directory: calculator/tests
        run: npx playwright install --with-deps chromium
      - name: Check calculator flows and responsive widths
        run: node calculator/tests/browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calculator-ui-preview
          path: calculator/tests/artifacts/
          retention-days: 14
