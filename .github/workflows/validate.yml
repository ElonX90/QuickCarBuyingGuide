name: Validate reviewed car index
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build.py --check
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build.py
      - run: git diff --exit-code -- docs/RANKING.md docs/MODEL_DETAILS.md docs/SOURCES.md data/scores.json data/model-index.csv
